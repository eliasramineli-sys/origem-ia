[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "origem-ia"
version = "0.1.0"
description = "Triagem experimental local de imagens e quadros de vídeos gerados por IA"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["Pillow==11.3.0", "numpy==2.2.6", "opencv-python-headless==4.12.0.88"]

[project.optional-dependencies]
ia = ["transformers==4.57.1", "torch>=2.6,<3", "safetensors>=0.5,<1"]

[project.scripts]
origemia = "origemia.cli:main"
origemia-desktop = "origemia.desktop:main"

[tool.setuptools.packages.find]
include = ["origemia*"]
